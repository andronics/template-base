[project]
name = "template-base"
version = "0.0.0"
description = "template-base (Copier): this file only drives the template's own tests"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "copier>=9.6,<10",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pyyaml>=6",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker and not npx'"
markers = [
    "docker: runs checks through Docker (uv run pytest -m docker)",
    "npx: runs Renovate's config validator through npx (uv run pytest -m npx)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["template", "tests/fixtures"]
