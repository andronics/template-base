# Template-owned: template-base
# Weekly pin bumps (decision 0002): self-hosted Renovate, with renovate/templates.json5, opens up to two PRs
# in the repository it runs for: fix(deps) for template sources, chore(deps) for the repository's own pins.
# Each template repository calls this workflow from its own pin-bumps.yml; template-base runs it directly.
#
# The PRs must come from a GitHub App, or their CI never runs: a PR opened with GITHUB_TOKEN starts no
# workflows. The token is the update role's (decision 0004: Courier, or another App filling the role), and
# its fallback is `required`: without the App this does nothing but say so. Needs, in the calling repository:
#   vars.UPDATE_APP_CLIENT_ID       the App's client ID
#   secrets.UPDATE_APP_PRIVATE_KEY  its private key (a caller passes it with `secrets: inherit`)
# or, for one release cycle, the legacy PIN_BUMP_APP_CLIENT_ID and PIN_BUMP_APP_PRIVATE_KEY (TODO.md).
# The App needs contents, pull requests and workflows (read and write) on the repository.
name: Pin bumps

on:
  schedule:
    - cron: '23 2 * * 0' # Sunday, inside the preset's "before 4am on sunday"
  workflow_dispatch:
  workflow_call:
    secrets:
      UPDATE_APP_PRIVATE_KEY:
        required: false
      PIN_BUMP_APP_PRIVATE_KEY: # legacy name, read until it's removed (decision 0004)
        required: false

permissions: {}

concurrency:
  group: pin-bumps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Pin bumps
    runs-on: ubuntu-latest
    steps:
      # The token action at the commit this workflow runs from: template-base's own, also when an overlay
      # calls this workflow at a pinned SHA (job.workflow_sha is the called workflow's commit, not the
      # caller's). template-base is public, so the empty-permission GITHUB_TOKEN can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .template-base
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: app-token
        uses: ./.template-base/.github/actions/app-token
        with:
          role: UPDATE
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          legacy-client-id: ${{ vars.PIN_BUMP_APP_CLIENT_ID }}
          legacy-private-key: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          fallback: required
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # A manual run means "now": lift the preset's Sunday-morning schedule for it.
      - if: steps.app-token.outputs.source != 'none' && github.event_name == 'workflow_dispatch'
        run: echo 'RENOVATE_FORCE={"schedule":["at any time"]}' >> "$GITHUB_ENV"
      - if: steps.app-token.outputs.source != 'none'
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.199.2
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
