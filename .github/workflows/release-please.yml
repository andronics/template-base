# Versions template-base. Projects pin to these tags (.copier-answers.*.yml
# _commit), and `copier update` moves them to the newest one, so every template
# change goes through a reviewed Release PR with a CHANGELOG entry.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The release role (Tagwarden here; decision 0004), else GITHUB_TOKEN as before: its release PRs run
      # no CI. contents, pull requests and issues (release-please's labels), never workflows (0002).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: app-token
        uses: ./.github/actions/app-token
        with:
          role: RELEASE
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          fallback: github-token
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
